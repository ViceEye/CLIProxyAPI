name: dev-image

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/viceeye/cli-proxy-api

jobs:
  validate:
    if: github.repository == 'ViceEye/CLIProxyAPI' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.7"
          cache: true
      - name: Check formatting
        shell: bash
        run: |
          set -euo pipefail
          unformatted="$(git ls-files '*.go' | xargs gofmt -l)"
          if [[ -n "$unformatted" ]]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        env:
          GIN_MODE: release
        run: go test ./... -count=1

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          echo "version=dev-${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}-${{ matrix.arch }}
          build-args: |
            GO_VERSION=1.26.7
            VERSION=${{ steps.metadata.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.metadata.outputs.date }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.metadata.outputs.version }}
          cache-from: type=gha,scope=dev-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=dev-${{ matrix.arch }}

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-architecture image
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:dev" \
            --tag "${IMAGE_NAME}:sha-${GITHUB_SHA}" \
            "${IMAGE_NAME}:sha-${GITHUB_SHA}-amd64" \
            "${IMAGE_NAME}:sha-${GITHUB_SHA}-arm64"
          docker buildx imagetools inspect "${IMAGE_NAME}:sha-${GITHUB_SHA}"
          {
            echo "### Published images"
            echo "- \`${IMAGE_NAME}:dev\`"
            echo "- \`${IMAGE_NAME}:sha-${GITHUB_SHA}\`"
            echo "- Platforms: linux/amd64, linux/arm64"
          } >> "$GITHUB_STEP_SUMMARY"
